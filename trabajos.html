<!-- DESCRIPCIÓN: portadas de los trabajos
Estructura general: una cuadrícula. Cada columna d ela cuadrícula es la portada de los trabajos. Desde esa portada s epuede acceder
 a la página individual de cada uno d elos trabajos   -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajos diseño gráfico y web | Carmen Gimeno</title>
    <script defer src="js/global.js"></script>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/trabajos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Cabecera añadida desde Javascript -->
    <element-cabecera></element-cabecera>
    <main>
        <h1 class="Titulo">carmen gimeno - trabajos</h1>
        <!-- Hay ocho trabajos divididos en 2 cuadrículas de 4 colmnas cada una -->
        <!-- Primera fila d eordenador, primeras dos en móvil -->
        <div class="Cuadricula">
            <div class="Cuadricula-wrapper">
                <!-- Cada cuadrícula individual tiene: imagen del prodcuto, título del trabajo y categoria del trabajo -->
                <article class="Cuadricula-individual">
                    <a href="la-cirera.html" class="Cuadricula-enlace">

                <article class="Cuadricula-individual">

                <article class="Cuadricula-individual">

        <!-- Segunda fila de ordenador -->
        <div class="Cuadricula">
